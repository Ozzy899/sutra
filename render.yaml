services:
  - type: web
    name: sutra
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: XAI_API_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: DAYTONA_API_KEY
        sync: false
      - key: NEXT_PUBLIC_CONVEX_URL
        value: https://energized-akita-832.eu-west-1.convex.cloud
